<script>
        let users = JSON.parse(localStorage.getItem("users")) || [];
        let userProfile = JSON.parse(localStorage.getItem('profile')) || null;
        let likedDogs = [];
        let isDragging = false;
        let startX = 0, startY = 0, currentX = 0, currentY = 0;
        let topCard = null;

        const dbDogs = [
            { id: 1, name: "Caramelo", age: "2 anos", breed: "Sem Raça Definida", city: "Itapetininga", img: "https://revistaoeste.com/oestegeral/wp-content/uploads/2025/06/cachorro-caramelo_1749242700989.jpg", desc: "Clássico brasileiro. Cheio de energia, muito carinhoso e amigável", size: "médio", species: "cão", medical: "vacinado e castrado" },
            { id: 2, name: "Luna", age: "6 meses", breed: "Labrador Mix", city: "Tatuí", species: "cão", size: "grande", medical: "Vacinada, vermifugada", img: "https://images.unsplash.com/photo-1552053831-71594a27632d?q=80&w=600&auto=format&fit=crop", desc: "Filhote aprendendo a fazer xixi no lugar certo. Muito dócil e se dá bem com crianças." },
            { id: 3, name: "Thor", age: "4 anos", breed: "Pitbull", city: "Itararé", species: "cão", size: "grande", medical: "Castrado e vacinado", img: "https://media.istockphoto.com/id/1370010790/photo/pit-bull-dog-playing-and-having-fun-in-the-park-green-grass-wooden-stakes-around-selective.jpg?s=612x612&w=0&k=20&c=2BhKHzjGSTauuMVtrjEx6aDQrACAPV7iZ2ExQtxArzs=", desc: "Um gigante bobão. Muito preguiçoso e adora um sofá." },
            { id: 4, name: "Nina", age: "1 ano", breed: "Poodle Mix", city: "Barão de Antonina", species: "cão", size: "pequeno", medical: "Vacinada e saudável", img: "https://www.keystonepuppies.com/wp-content/uploads/2025/10/Poodle-Mix2.jpg", desc: "Pequenina, ideal para apartamento. Um pouco tímida no começo, mas depois é puro chamego." },
            { id: 6, name: "Mimi", age: "2 anos", breed: "Siamês", city: "Itapetininga", species: "gato", size: "pequeno", medical: "Vacinada e castrada", img: "https://static.wikia.nocookie.net/gatopedia/images/3/3a/Gato_Siam%C3%AAs.png/revision/latest?cb=20140429132749&path-prefix=pt-br", desc: "Carinhosa e tranquila. Ideal para apartamentos e pessoas que buscam companhia calma." }
            // (Encurtei a lista visualmente aqui para focar no código principal, o resto dos dados continua o mesmo na lógica)
        ];

        let dogsList = [];

        function seededRandom(seed) {
            let x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function enrichPet(pet) {
            const ageNumber = parseInt(pet.age);
            let ageCategory = "adulto";
            if (pet.age.includes("mes")) ageCategory = "filhote";
            if (ageNumber >= 7) ageCategory = "idoso";

            const rng = seededRandom(pet.id);

            return {
                ...pet,
                ageCategory,
                goodWithPets: rng > 0.4,
                goodWithKids: seededRandom(pet.id * 3) > 0.3,
                temperament: pet.temperament || (rng > 0.5 ? "brincalhão" : "calmo")
            };
        }

        const cardsContainer = document.getElementById('cards-container');
        const emptyState = document.getElementById('empty-state');
        const likedGrid = document.getElementById('liked-grid');
        const noLikesMsg = document.getElementById('no-likes');
        const likedBadge = document.getElementById('liked-badge');
        const viewSwipe = document.getElementById('view-swipe');
        const viewLiked = document.getElementById('view-liked');
        const navSwipeBtn = document.getElementById('nav-swipe');
        const navLikedBtn = document.getElementById('nav-liked');
        const viewUserSettings = document.getElementById('view-user-settings');

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
            checkAutoLogin();
        });

        function initApp() {
            let processedDogs = dbDogs.map(enrichPet);
            dogsList = [...processedDogs];
            setupNavigation();
            setupActionButtons();
        }

        function checkAutoLogin() {
            const activeUser = localStorage.getItem('currentUser');
            if(activeUser) {
                enterApp();
            }
        }

        function toggleAuth(type) {
            document.getElementById('form-login').classList.toggle('hidden', type === 'register');
            document.getElementById('form-register').classList.toggle('hidden', type === 'login');
        }

        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', email);
                enterApp();
            } else {
                alert("Email ou senha incorretos!");
            }
        }

        function register() {
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            if (!email || !password) {
                alert("Preencha todos os campos!"); return;
            }

            if (users.find(u => u.email === email)) {
                alert("Esse email já está cadastrado!"); return;
            }

            users.push({ email, password });
            localStorage.setItem("users", JSON.stringify(users));
            localStorage.setItem('currentUser', email);
            enterApp();
        }

        function logout() {
            localStorage.removeItem('currentUser');
            closeUserSettings();
            document.getElementById('app').classList.add('hidden');
            document.getElementById('view-auth').classList.remove('hidden');
            
            // Reseta inputs
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            switchTab('swipe'); 
        }

        function enterApp() {
            document.getElementById('view-auth').classList.add('hidden');
            const saved = localStorage.getItem('profile');

            if (saved) {
                userProfile = JSON.parse(saved);
                document.getElementById('app').classList.remove('hidden');
                applySmartFilters();
            } else {
                document.getElementById('view-profile').classList.remove('hidden');
            }
        }

        // --- SISTEMA DE PERFIL DO USUÁRIO ---

        // Utilitários para ler/escrever Radio Buttons e Checkboxes
        function getRadioVal(name) {
            const el = document.querySelector(`input[name="${name}"]:checked`);
            return el ? el.value : "";
        }

        function setRadioVal(name, value) {
            const el = document.querySelector(`input[name="${name}"][value="${value}"]`);
            if (el) el.checked = true;
        }

        function openUserSettings() {
            const email = localStorage.getItem('currentUser') || 'visitante@adotaai.com';
            document.getElementById('profile-user-email').textContent = email;
            
            viewUserSettings.classList.remove('hidden');
            viewUserSettings.classList.add('flex');
        }

        function closeUserSettings() {
            viewUserSettings.classList.add('hidden');
            viewUserSettings.classList.remove('flex');
        }

        function triggerProfileEditFromSettings() {
            closeUserSettings();
            openProfileEdit();
        }

        function openProfileEdit() {
            if (userProfile) {
                setRadioVal('p-housing', userProfile.housing || "casa");
                setRadioVal('p-activity', userProfile.activity || "moderado");
                setRadioVal('p-species', userProfile.species || "");
                setRadioVal('p-size', userProfile.size || "");
                
                document.getElementById('p-age').value = userProfile.age || "";
                document.getElementById('p-temperament').value = userProfile.temperament || "";
                document.getElementById('p-routine').value = userProfile.routine || "fica_em_casa";
                document.getElementById('p-experience').value = userProfile.experience || "intermediario";
                
                document.getElementById('p-allergy').checked = (userProfile.allergy === "sim");
                document.getElementById('p-kids').checked = (userProfile.kids === "sim");
                document.getElementById('p-otherPets').checked = (userProfile.otherPets === "sim");
            }
            
            document.getElementById('filter-menu').classList.add('hidden');
            document.getElementById('filter-icon').classList.replace('ph-caret-up', 'ph-caret-down');
            document.getElementById('app').classList.add('hidden');
            document.getElementById('view-profile').classList.remove('hidden');
            document.getElementById('view-profile').classList.add('flex'); // Necessário para o novo layout
        }

        function saveProfile() {
            const profile = {
                housing: getRadioVal('p-housing'),
                activity: getRadioVal('p-activity'),
                species: getRadioVal('p-species'),
                size: getRadioVal('p-size'),
                
                age: document.getElementById('p-age').value,
                temperament: document.getElementById('p-temperament').value,
                routine: document.getElementById('p-routine').value,
                experience: document.getElementById('p-experience').value,
                
                allergy: document.getElementById('p-allergy').checked ? "sim" : "não",
                kids: document.getElementById('p-kids').checked ? "sim" : "não",
                otherPets: document.getElementById('p-otherPets').checked ? "sim" : "não"
            };

            localStorage.setItem('profile', JSON.stringify(profile));
            userProfile = profile;

            document.getElementById('view-profile').classList.add('hidden');
            document.getElementById('view-profile').classList.remove('flex');
            document.getElementById('app').classList.remove('hidden');
            applySmartFilters();
        }

        function applySmartFilters() {
            const processedDogs = dbDogs.map(pet => {
                const enriched = enrichPet(pet);
                return enrichWithMatch(userProfile, enriched);
            });

            dogsList = processedDogs.sort((a, b) => b.matchScore - a.matchScore);
            renderCards();
        }

        function toggleFilterMenu() {
            const menu = document.getElementById('filter-menu');
            const icon = document.getElementById('filter-icon');
            const isOpen = !menu.classList.contains('hidden');

            if (isOpen) {
                menu.classList.add('hidden');
                icon.classList.replace('ph-caret-up', 'ph-caret-down');
            } else {
                menu.classList.remove('hidden');
                icon.classList.replace('ph-caret-down', 'ph-caret-up');
            }
        }

        function applyFilters() {
            const species = document.getElementById('filter-species').value;
            const size = document.getElementById('filter-size').value;
            const temp = document.getElementById('filter-temp').value;
            const kidsOnly = document.getElementById('filter-kids').value === "true";

            let filteredResults = dbDogs.filter(dog => {
                const traits = enrichPet(dog);
                const matchSpecies = !species || dog.species === species;
                const matchSize = !size || dog.size === size;
                const matchTemp = !temp || traits.temperament === temp;
                const matchKids = !kidsOnly || traits.goodWithKids === true;

                return matchSpecies && matchSize && matchTemp && matchKids;
            });

            dogsList = filteredResults.map(dog => {
                const enrichedTraits = enrichPet(dog);
                return enrichWithMatch(userProfile || {}, enrichedTraits);
            });

            dogsList.sort((a, b) => b.matchScore - a.matchScore);
            renderCards();
            toggleFilterMenu();
        }

        // --- SISTEMA DE CARDS & FÍSICA ---

        function createCardElement(dog, index) {
            const card = document.createElement('div');
            card.className = 'swipe-card shadow-2xl border border-gray-100';
            card.style.zIndex = dogsList.length - index;

            card.addEventListener('click', (e) => {
                // Impede abrir modal se o usuário tentou arrastar
                if(!isDragging) showDetails(dog);
            });

            const matchColor = dog.matchScore >= 80 ? "bg-green-500" : dog.matchScore >= 60 ? "bg-yellow-400" : "bg-red-500";

            if (index > 0) {
                card.style.transform = `scale(${1 - (index * 0.04)}) translateY(${index * 12}px)`;
            }

            card.innerHTML = `
                <div class="stamp stamp-like border-green-500 text-green-500 bg-white/90 backdrop-blur-sm">Curti</div>
                <div class="stamp stamp-nope border-red-500 text-red-500 bg-white/90 backdrop-blur-sm">Passei</div>
                
                <div class="absolute top-4 left-4 bg-black/50 text-white text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-md flex items-center gap-2 border border-white/20 shadow-lg">
                    <span class="w-2.5 h-2.5 rounded-full ${matchColor} shadow-inner"></span>
                    ${dog.matchScore || 0}% compatível
                </div>
                
                <img src="${dog.img}" class="w-full h-full object-cover select-none pointer-events-none">
                
                <div class="absolute bottom-0 w-full p-6 text-white card-gradient pb-8 pt-20">
                    <div class="flex justify-between items-end mb-1">
                        <div>
                            <h2 class="text-3xl font-bold leading-tight drop-shadow-md">${dog.name}, <span class="text-2xl font-normal">${dog.age}</span></h2>
                            <p class="flex items-center text-sm font-medium mt-1 text-gray-200 drop-shadow">
                                <i class="ph-fill ph-paw-print mr-1.5"></i> ${dog.breed}
                            </p>
                        </div>
                        <button class="bg-white/20 p-2.5 rounded-full backdrop-blur-md hover:bg-white/30 transition-colors border border-white/30">
                            <i class="ph-bold ph-info text-2xl"></i>
                        </button>
                    </div>
                    <p class="flex items-center text-sm font-bold mb-3 text-orange-300 drop-shadow-md">
                        <i class="ph-fill ph-map-pin mr-1.5"></i> ${dog.city}
                    </p>
                    <p class="text-sm line-clamp-2 text-white bg-black/30 p-3.5 rounded-2xl backdrop-blur-md border border-white/10 shadow-inner">${dog.desc}</p>
                </div>
            `;
            return card;
        }

        function renderCards() {
            cardsContainer.innerHTML = '';

            if (dogsList.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            const visibleDogs = dogsList.slice(0, 3);
            [...visibleDogs].reverse().forEach((dog, reversedIndex) => {
                const index = visibleDogs.length - 1 - reversedIndex;
                const card = createCardElement(dog, index);
                cardsContainer.appendChild(card);
            });

            topCard = cardsContainer.lastElementChild;
            if (topCard) {
                setupDragEvents(topCard);
            }
        }

        function setupDragEvents(card) {
            card.addEventListener('mousedown', handleDragStart);
            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('mouseup', handleDragEnd);

            card.addEventListener('touchstart', handleDragStart, { passive: false });
            document.addEventListener('touchmove', handleDragMove, { passive: false });
            document.addEventListener('touchend', handleDragEnd);
        }

        function removeDragEvents() {
            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);
            document.removeEventListener('touchmove', handleDragMove);
            document.removeEventListener('touchend', handleDragEnd);
        }

        function handleDragStart(e) {
            if (!topCard) return;
            // Apenas flag pra drag real
            isDragging = false; 

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            startX = clientX;
            startY = clientY;
            topCard.style.transition = 'none';
        }

        function handleDragMove(e) {
            if (!topCard) return;
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            currentX = clientX - startX;
            currentY = clientY - startY;

            // Define tolerância pra click vs drag
            if (Math.abs(currentX) > 10 || Math.abs(currentY) > 10) {
                isDragging = true;
                if (e.type.includes('touch')) e.preventDefault();
            }

            if(!isDragging) return;

            const rotate = currentX * 0.1;
            topCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

            const likeStamp = topCard.querySelector('.stamp-like');
            const nopeStamp = topCard.querySelector('.stamp-nope');
            const opacity = Math.min(Math.abs(currentX) / 100, 1);

            if (currentX > 0) {
                likeStamp.style.opacity = opacity;
                nopeStamp.style.opacity = 0;
            } else {
                nopeStamp.style.opacity = opacity;
                likeStamp.style.opacity = 0;
            }
        }

        function handleDragEnd() {
            if (!topCard) return;

            if(!isDragging) {
                 resetCardPosition();
                 return; // Foi um click limpo
            }

            topCard.style.transition = 'transform 0.3s ease-out';
            const threshold = window.innerWidth * 0.25;

            if (currentX > threshold) {
                executeSwipe('right');
            } else if (currentX < -threshold) {
                executeSwipe('left');
            } else {
                resetCardPosition();
            }

            // Reseta para o próximo click/drag
            setTimeout(() => { isDragging = false; }, 50); 
            currentX = 0;
            currentY = 0;
        }

        function resetCardPosition() {
            topCard.style.transform = 'translate(0px, 0px) rotate(0deg)';
            topCard.querySelector('.stamp-like').style.opacity = 0;
            topCard.querySelector('.stamp-nope').style.opacity = 0;
        }

        function executeSwipe(direction) {
            removeDragEvents();
            
            const cardToSwipe = topCard;
            const currentDog = dogsList[0];

            cardToSwipe.classList.add('animating');
            if(direction !== 'up') {
                cardToSwipe.classList.add(`swipe-${direction}`);
            }

            if (direction === 'right' || direction === 'up') {
                addToLiked(currentDog);
            }

            dogsList.shift();

            setTimeout(() => {
                if (cardToSwipe.parentNode) cardToSwipe.parentNode.removeChild(cardToSwipe);
                renderCards();
            }, 300);
        }

        function setupActionButtons() {
            document.getElementById('btn-nope').addEventListener('click', () => {
                if (dogsList.length > 0) executeSwipe('left');
            });

            document.getElementById('btn-like').addEventListener('click', () => {
                if (dogsList.length > 0) executeSwipe('right');
            });

            document.getElementById('btn-superlike').addEventListener('click', () => {
                if (dogsList.length > 0) {
                    topCard.classList.add('animating', 'swipe-up');
                    executeSwipe('up'); 
                }
            });
        }

        // --- SISTEMA DE MATCHES & MODAL ---

        function addToLiked(dog) {
            likedDogs.push(dog);
            updateLikedView();
            updateBadge();
        }

        function updateBadge() {
            if (likedDogs.length > 0) {
                likedBadge.textContent = likedDogs.length;
                likedBadge.classList.remove('hidden');

                navLikedBtn.classList.add('text-red-500', 'scale-110');
                setTimeout(() => {
                    if (viewSwipe.classList.contains('flex')) {
                        navLikedBtn.classList.remove('text-red-500', 'scale-110');
                    }
                }, 300);
            } else {
                likedBadge.classList.add('hidden');
            }
        }

        function updateLikedView() {
            if (likedDogs.length === 0) {
                noLikesMsg.classList.remove('hidden');
                likedGrid.innerHTML = '';
            } else {
                noLikesMsg.classList.add('hidden');
                likedGrid.innerHTML = likedDogs.map(dog => `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer hover:shadow-md transition-shadow active:scale-95">
                        <div class="h-40 relative">
                            <img src="${dog.img}" class="w-full h-full object-cover">
                            <div class="absolute bottom-2 left-2 bg-white/90 backdrop-blur text-xs font-bold px-3 py-1 rounded-full text-green-600 flex items-center shadow-sm">
                                <i class="ph-fill ph-check-circle mr-1"></i> Match
                            </div>
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-gray-800">${dog.name}</h3>
                            <p class="text-xs text-gray-500 truncate mt-0.5"><i class="ph-fill ph-paw-print"></i> ${dog.breed}</p>
                            <button class="mt-3 w-full bg-orange-50 text-orange-600 text-sm font-bold py-2.5 rounded-xl flex justify-center items-center hover:bg-orange-100 transition-colors">
                                <i class="ph-fill ph-chat-circle mr-2 text-lg"></i> Mensagem
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function showDetails(dog) {
            document.getElementById('modal-img').src = dog.img;
            document.getElementById('modal-name').textContent = dog.name;
            document.getElementById('modal-breed').textContent = dog.breed;
            document.getElementById('modal-age').innerHTML = `<i class="ph-fill ph-clock"></i> ${dog.age}`;
            document.getElementById('modal-city').innerHTML = `<i class="ph-fill ph-map-pin"></i> ${dog.city}`;
            document.getElementById('modal-size').textContent = dog.size;
            document.getElementById('modal-medical').textContent = dog.medical;
            document.getElementById('modal-desc').textContent = dog.desc;

            document.getElementById('pet-modal').classList.remove('hidden');
            document.getElementById('pet-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('pet-modal').classList.add('hidden');
            document.getElementById('pet-modal').classList.remove('flex');
        }

        function fakeAdoptionAction() {
            closeModal();
            alert("A ONG recebeu seu interesse pelo pet! 🧡 Em breve entrarão em contato no seu email/WhatsApp.");
        }

        // --- NAVEGAÇÃO & SCORE ---

        function setupNavigation() {
            navSwipeBtn.addEventListener('click', () => switchTab('swipe'));
            navLikedBtn.addEventListener('click', () => switchTab('liked'));
        }

        function switchTab(tab) {
            if (tab === 'swipe') {
                viewSwipe.classList.remove('hidden');
                viewSwipe.classList.add('flex');
                viewLiked.classList.add('hidden');
                viewLiked.classList.remove('flex');

                navSwipeBtn.classList.add('text-orange-500');
                navSwipeBtn.classList.remove('text-gray-400');
                navLikedBtn.classList.add('text-gray-400');
                navLikedBtn.classList.remove('text-red-500');
            } else {
                viewSwipe.classList.add('hidden');
                viewSwipe.classList.remove('flex');
                viewLiked.classList.remove('hidden');
                viewLiked.classList.add('flex');

                navSwipeBtn.classList.remove('text-orange-500');
                navSwipeBtn.classList.add('text-gray-400');
                navLikedBtn.classList.remove('text-gray-400');
                navLikedBtn.classList.add('text-red-500');
            }
        }

        function calculateMatchScore(user, pet) {
            if (!user) return 20;
            let score = 20;

            if (user.species === "" || user.species === pet.species) score += 30;

            if (user.housing === "apartamento" && pet.size === "pequeno") score += 20;
            else if (user.housing === "casa_quintal" && pet.size === "grande") score += 20;
            else if (user.size === pet.size) score += 20;
            else score += 10;

            if (user.activity === "ativo" && pet.temperament === "brincalhão") score += 20;
            else if (user.activity === "sedentario" && pet.temperament === "calmo") score += 20;
            else if (user.activity === "moderado") score += 15;

            if (user.kids === "sim" && pet.goodWithKids) score += 10;
            if (user.otherPets === "sim" && pet.goodWithPets) score += 10;
            if (user.kids === "não") score += 10;
            if (user.otherPets === "não") score += 10;

            if (user.age === "" || user.age === pet.ageCategory) score += 10;

            return Math.min(score, 100);
        }

        function enrichWithMatch(user, pet) {
            const score = calculateMatchScore(user, pet);
            return {
                ...pet,
                matchScore: score
            };
        }

        function resetApp() {
            let processedDogs = dbDogs.map(enrichPet);
            dogsList = processedDogs.map(dog => enrichWithMatch(userProfile, dog));
            
            likedDogs = [];
            updateLikedView();
            updateBadge();
            emptyState.classList.add('hidden');
            switchTab('swipe');
            renderCards();
            
            isDragging = false;
            currentX = 0;
            currentY = 0;
            topCard = null;
        }
    </script>
